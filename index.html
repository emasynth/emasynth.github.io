:root{

  --bone:#f2eefc;
  --violet:#8a5cff;
  --cyan:#29e3d0;
  --pink:#ff3d8b;
  --glass:rgba(242,238,252,.08);
  --line:rgba(242,238,252,.26);

}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--body);color:var(--bone);background:var(--ink);-webkit-font-smoothing:antialiased;overflow-x:hidden}

/* ---------- Sfondo: bagliori + equalizer ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--ink)}
.bg::before{
  content:"";position:absolute;inset:-30%;
  background:
    radial-gradient(38% 38% at 22% 28%,var(--violet),transparent 70%),
    radial-gradient(34% 34% at 80% 62%,var(--pink),transparent 70%),
    radial-gradient(30% 30% at 40% 90%,var(--cyan),transparent 70%);
  filter:blur(50px);opacity:.45;
  animation:drift 20s ease-in-out infinite alternate;
}
.eq{position:absolute;left:0;right:0;bottom:0;height:46%;display:flex;align-items:flex-end;gap:1.2%;padding:0 2%}
.eq i{flex:1;height:100%;border-radius:6px 6px 0 0;transform-origin:bottom;transform:scaleY(.2);
  background:linear-gradient(180deg,var(--cyan),var(--violet) 60%,transparent);opacity:.38;
  animation:beat var(--d,1.2s) ease-in-out var(--s,0s) infinite alternate}
.bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(14,11,22,.5) 0%,rgba(14,11,22,.3) 45%,rgba(14,11,22,.72) 100%)}
@keyframes drift{from{transform:translate(-4%,-3%) rotate(0) scale(1)}to{transform:translate(4%,3%) rotate(14deg) scale(1.15)}}
@keyframes beat{from{transform:scaleY(.12)}to{transform:scaleY(1)}}

/* ---------- Layout ---------- */
main{min-height:100%;max-width:460px;margin:0 auto;padding:66px 18px 36px;
  display:flex;flex-direction:column;align-items:center;text-align:center}

/* ---------- Disco + foto profilo ---------- */
.disc{position:relative;width:150px;height:150px;margin:40px 0 58px;flex:none}
.disc::before{content:"";position:absolute;inset:-46px;border-radius:50%;
  background:
    conic-gradient(from 0deg,transparent 0 18%,rgba(242,238,252,.28) 25%,transparent 32% 68%,rgba(242,238,252,.28) 75%,transparent 82%),
    repeating-radial-gradient(circle,#171123 0 2px,#33274f 2px 3px);
  box-shadow:0 0 0 2px rgba(138,92,255,.5),0 10px 40px rgba(138,92,255,.45);
  animation:spin 16s linear infinite}
.disc::after{content:"";position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(var(--cyan),var(--violet),var(--pink),var(--cyan));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));
  mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px))}
.ph{position:absolute;inset:0;border-radius:50%;overflow:hidden;z-index:1;background:linear-gradient(135deg,var(--violet),var(--pink))}
.ph img,.ph svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ph img{object-fit:cover}
@keyframes spin{to{transform:rotate(360deg)}}
.wave{width:120px;height:22px;margin:-8px 0 30px;stroke:var(--cyan);fill:none;stroke-width:2.5;stroke-linecap:round;opacity:.9}

/* ---------- Nome ---------- */
h1{margin:0 0 14px;font:800 clamp(2.6rem,13vw,3.6rem)/1 var(--display);letter-spacing:-.04em;
  background:linear-gradient(100deg,var(--bone) 20%,var(--cyan) 55%,var(--pink));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 22px rgba(138,92,255,.45))}
.tagline{margin:0 0 22px;font:600 .95rem/1.3 var(--display);letter-spacing:-.01em;color:rgba(242,238,252,.85)}

/* ---------- Link ---------- */
.links{list-style:none;margin:0;padding:0;width:100%;display:grid;gap:12px}
.links a{
  display:flex;align-items:center;justify-content:center;gap:12px;
  min-height:56px;padding:14px 20px;color:var(--bone);text-decoration:none;
  font:600 1.05rem/1.2 var(--body);
  background:var(--glass);border:1px solid var(--line);border-radius:999px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:background .2s,color .2s,transform .2s,border-color .2s;
}
.links a svg{width:24px;height:24px;flex:none;fill:currentColor}
.ic-sc{fill:#ff7a2e!important}.ic-yt{fill:#ff3b3b!important}.ic-ht{fill:var(--cyan)!important}
.ic-fb{fill:#4C8DFF!important}.ic-ig{fill:url(#igGrad)!important}.ic-tk{fill:var(--bone)!important}
.links a:hover{background:var(--bone);color:var(--ink);border-color:var(--bone);transform:scale(1.02)}
.links a:hover .ic-tk{fill:var(--ink)!important}
.links a:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.links a.primary{background:linear-gradient(100deg,var(--violet),var(--pink));border-color:transparent;color:#fff}
.links a.primary svg{fill:#fff!important}
.links a.primary:hover{background:var(--bone);color:var(--ink)}
.links a.primary:hover svg{fill:#ff7a2e!important}
.lbl{display:flex;flex-direction:column;align-items:center;gap:2px}
.lbl small{font:500 .85rem/1.2 var(--body);opacity:.85}
footer{margin-top:auto;padding-top:40px;font-size:.85rem;color:rgba(242,238,252,.6)}

@media (prefers-reduced-motion:reduce){
  .bg::before,.eq i,.disc::before{animation:none}
  .eq i{transform:scaleY(.5)}
  .links a{transition:none}
}

/* Mini player musicale */
/* Controllo audio minimale, senza player tradizionale */
.music-mini{display:flex;justify-content:center;margin:0 0 24px}
.music-toggle{display:inline-flex;align-items:center;gap:9px;min-height:38px;padding:8px 15px;border:1px solid var(--line);border-radius:999px;background:rgba(242,238,252,.07);color:var(--bone);font:600 .78rem var(--body);letter-spacing:.04em;cursor:pointer;backdrop-filter:blur(10px)}
.music-toggle::before{content:'♫';font-size:1.15rem;color:var(--cyan)}
.music-toggle.is-playing{border-color:rgba(41,227,208,.55)}
.music-toggle:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}

/* Mobile bilanciato: usa l'altezza disponibile senza lasciare un grande vuoto. */
@media (max-width:600px){
  main{min-height:100svh;padding:clamp(14px,2.2svh,28px) 16px clamp(14px,2svh,24px)}
  .disc{width:clamp(104px,15svh,145px);height:clamp(104px,15svh,145px);margin:clamp(27px,4.2svh,42px) 0 clamp(25px,3.8svh,42px)}
  .disc::before{inset:-22px}
  h1{font-size:clamp(2.25rem,10.5vw,3.05rem);margin-bottom:clamp(8px,1.1svh,13px)}
  .tagline{font-size:clamp(.78rem,2.8vw,.94rem);margin-bottom:clamp(11px,1.7svh,19px)}
  .wave{width:105px;height:20px;margin:-3px 0 clamp(12px,2svh,22px)}
  .music-mini{margin-bottom:clamp(15px,2.4svh,27px)}
  .music-toggle{min-height:39px;padding:8px 15px}
  .links{gap:clamp(8px,1.15svh,13px)}
  .links a{min-height:clamp(49px,6.7svh,62px);padding:10px 15px;font-size:1.03rem;gap:11px}
  .links a svg{width:23px;height:23px}
  .lbl small{font-size:.79rem}
  footer{margin-top:0;padding-top:clamp(16px,2.5svh,28px);font-size:.78rem}
}
/* Telefoni bassi: priorità alla visibilità di tutti i link. */
@media (max-width:600px) and (max-height:740px){
  main{padding-top:10px;padding-bottom:12px}
  .disc{width:96px;height:96px;margin:24px 0 23px}
  .disc::before{inset:-18px}
  h1{font-size:clamp(2rem,9vw,2.65rem);margin-bottom:7px}
  .tagline{font-size:.72rem;margin-bottom:10px}
  .wave{width:88px;height:16px;margin:-3px 0 11px}
  .music-mini{margin-bottom:12px}
  .music-toggle{min-height:36px;padding:6px 12px}
  .links{gap:7px}
  .links a{min-height:44px;padding:8px 14px;font-size:.96rem;gap:9px}
  .links a svg{width:20px;height:20px}
  .lbl small{font-size:.72rem}
  footer{padding-top:14px;font-size:.72rem}
}

/* Leggibilità migliorata su smartphone: testi più grandi, spazi equilibrati. */
@media (max-width:600px){
  .links a{font-size:clamp(1.13rem,4.6vw,1.28rem);font-weight:600;line-height:1.2}
  .lbl small{font-size:clamp(.88rem,3.5vw,1rem);opacity:1}
  .tagline{font-size:clamp(.88rem,3.5vw,1.04rem)}
  .music-toggle{font-size:.95rem;letter-spacing:0}
  footer{font-size:.88rem}
}
@media (max-width:600px) and (max-height:740px){
  .links a{font-size:1.08rem}
  .lbl small{font-size:.84rem}
  .tagline{font-size:.84rem}
  .music-toggle{font-size:.88rem}
}

<script>
  document.getElementById('y').textContent = new Date().getFullYear();
  var eq = document.getElementById('eq');
  for (var i = 0; i < 26; i++) {
    var b = document.createElement('i');
    b.style.setProperty('--d', (0.7 + Math.random() * 0.9).toFixed(2) + 's');
    b.style.setProperty('--s', (-Math.random() * 1.5).toFixed(2) + 's');
    eq.appendChild(b);
  }

  const music = document.getElementById('backgroundMusic');
  const musicToggle = document.getElementById('musicToggle');
  const musicStatus = document.getElementById('musicStatus');
  music.volume = 0.35;
  function updateMusicUI() {
    const playing = !music.paused;
    musicToggle.classList.toggle('is-playing', playing);
    musicToggle.setAttribute('aria-pressed', String(playing));
    musicToggle.setAttribute('aria-label', playing ? 'Disattiva musica' : 'Attiva musica');
    musicStatus.textContent = playing ? 'Musica attiva · pausa' : 'Attiva musica';
  }
  musicToggle.addEventListener('click', async () => {
    if (!music.paused) { music.pause(); return; }
    try { await music.play(); }
    catch (_) { musicStatus.textContent = 'Audio non disponibile'; }
  });
  music.addEventListener('play', updateMusicUI);
  music.addEventListener('pause', updateMusicUI);
  music.addEventListener('error', () => { musicStatus.textContent = 'Audio non disponibile'; });
  // I browser possono bloccare l'autoplay con audio: in quel caso resta il piccolo pulsante.
  window.addEventListener('load', () => { music.play().catch(() => { updateMusicUI(); }); });

</script>
</body>
